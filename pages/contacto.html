<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html"
          ><img src="../img/vinilo1.svg" alt="logo de la tienda"
        /></a>
      </div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contáctanos</h1>
        <form class="form-contacto" action="" method="POST">
          <div class="grupo-input">
            <label for="email"> Tu email: </label>
            <input id="email" type="email" name="email" />
          </div>

          <div class="grupo-input">
            <label for="mensaje"> Tu mensaje: </label>
            <textarea id="mensaje" name="message"></textarea>
          </div>
          <!-- your other form fields go here -->
          <button class="btn bg-secondary text-dark" type="submit">
            Enviar
          </button>
        </form>
      </section>
    </main>
    <footer>
      <p>Sitio realizado por Mauro Nelli para Talento Tech</p>
      <nav>
        <ul class="footer-list">
          <li>
            <img src="../img/whatsapp.png" alt="logo whatsapp" />
            <img src="../img/social.png" alt="logo instagram" />
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
